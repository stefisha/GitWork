<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#0d1117" />
    <meta
      name="description"
      content="GitWork is currently on hiatus. The hackathon project remains archived on GitHub."
    />
    <title>GitWork — Project on hiatus</title>
    <link rel="icon" href="./logo.png" />
    <style>
      :root {
        color-scheme: dark;
        font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
          Helvetica, Arial, sans-serif;
        background: #0d1117;
        color: #ffffff;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        min-height: 100%;
        margin: 0;
      }

      body {
        min-height: 100svh;
        display: grid;
        place-items: center;
        overflow: hidden;
        background:
          radial-gradient(circle at 50% 42%, rgba(139, 92, 246, 0.15), transparent 28rem),
          #0d1117;
      }

      main {
        width: min(90vw, 44rem);
        padding: 3rem 1.5rem;
        text-align: center;
      }

      .logo {
        display: block;
        width: clamp(5rem, 15vw, 7.5rem);
        height: auto;
        margin: 0 auto 0.65rem;
        filter: drop-shadow(0 0 2rem rgba(139, 92, 246, 0.28));
      }

      h1 {
        margin: 0;
        font-size: clamp(3.25rem, 12vw, 7rem);
        font-weight: 800;
        letter-spacing: -0.075em;
        line-height: 0.95;
      }

      .rule {
        width: 3.25rem;
        height: 2px;
        margin: 2rem auto;
        background: #8b5cf6;
        border-radius: 999px;
      }

      p {
        margin: 0;
        color: #c4b5fd;
        font-size: clamp(1rem, 2.8vw, 1.25rem);
        font-weight: 500;
        letter-spacing: 0.01em;
      }

      @media (prefers-reduced-motion: no-preference) {
        main {
          animation: arrive 700ms cubic-bezier(0.22, 1, 0.36, 1) both;
        }

        @keyframes arrive {
          from {
            opacity: 0;
            transform: translateY(0.75rem);
          }
        }
      }
    </style>
  </head>
  <body>
    <main>
      <img class="logo" src="./logo.png" alt="GitWork octopus logo" />
      <h1>GitWork</h1>
      <div class="rule" aria-hidden="true"></div>
      <p>Project on hiatus.</p>
    </main>
  </body>
</html>
